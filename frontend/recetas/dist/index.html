  <body>
    <div id="root"></div>

    <!-- ✅ Asegurar que Vite carga el script principal -->

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/service-worker.js")
            .then((registration) => {
              // ✅ Detectar entorno sin usar `import.meta`
              if (window.location.hostname === "localhost") {
                console.log("✅ Service Worker registrado en desarrollo:", registration);
              }
            })
            .catch((error) => {
              console.error("❌ Error al registrar el Service Worker:", error);
            });
        });
      }
    </script>
  </body>
