<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin conexión - ¿Y HOY QUÉ?</title>
    <style>
        body {
            text-align: center;
            font-family: "Raleway", sans-serif;
            background-color: #0f172b;
            color: white;
            padding: 50px;
        }
        h1 {
            color: #ee8532;
            font-family: "Josefin Slab", serif;
            font-size: 28px;
        }
        p {
            font-size: 18px;
            margin-bottom: 15px;
        }
        button {
            background-color: #ee8532;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            margin-top: 20px;
            cursor: pointer;
            font-size: 16px;
            font-family: "Raleway", sans-serif;
        }
        button:hover {
            background-color: #d8732b;
        }
        img {
            width: 150px;
            margin: 20px 0;
        }
        #status {
            margin-top: 20px;
            font-size: 16px;
            color: #ee8532;
        }
    </style>
</head>
<body>
    <h1>Sin conexión</h1>
    <img src="/img/offline.png" alt="Modo Offline" />
    <p>No tienes acceso a internet en este momento.</p>
    <p>Por favor, revisa tu conexión para seguir navegando.</p>

    <button onclick="location.reload()">Reintentar conexión</button>

    <p id="status">Esperando reconexión...</p>

    <script>
        function checkOnlineStatus() {
            if (navigator.onLine) {
                document.getElementById("status").innerText =
                    "✅ Conexión restaurada. Recargando...";
                setTimeout(() => location.reload(), 1500);
            }
        }
        window.addEventListener("online", checkOnlineStatus);
    </script>
</body>
</html>
